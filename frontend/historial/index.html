<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="assets/style.css">

    <title>Historial</title>
    <link rel="icon" href="assets/iconDashboard.png" type="image/png">
</head>
<body>

<nav class="navbar is-fixed-top">
    <div class="container">
        <div class="navbar-brand">
            <a class="navbar-item" href="../dashboard/index.html">
                <h1 class="title is-4">Malervas FCI</h1>
            </a>
        </div>
        <div class="navbar-menu is-active" style="box-shadow: none; background: transparent;">
            <div class="navbar-end">
                <div class="navbar-item">
                    <a class="button is-dark mr-2" href="../dashboard/index.html">
                        <span class="icon"><i class="fas fa-chart-line"></i></span>
                        <span>Dashboard</span>
                    </a>
                    <a class="button is-dark is-outlined" href="../transacciones/index.html">
                        <span class="icon"><i class="fas fa-plus"></i></span>
                        <span>Nuevo Movimiento</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container main-container">
    <div class="columns is-centered">
        <div class="column is-10">
            <div class="box">
                <div class="historial-title-container historial-header-wrapper">
                    <div class="historial-title-left">
                        <span class="icon is-medium mr-3 historial-icon"><i class="fas fa-history fa-lg"></i></span>
                        <h2 class="title is-4 historial-title" style="margin-bottom: 0;">Historial</h2>
                    </div>
                    <button id="btn_limpiar" class="button is-danger is-outlined is-small btn-reset-fondo">
                        <span class="icon is-small"><i class="fas fa-trash"></i></span>
                        <span>Resetear Fondo</span>
                    </button>
                </div>

                <div class="table-container">
                    <table class="table is-fullwidth is-hoverable">
                        <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Nombre</th>
                            <th>Operación</th>
                            <th>Monto</th>
                            <th>Cuotapartes</th>
                            <th>Precio Cuota</th>
                        </tr>
                        </thead>
                        <tbody id="tabla_historial">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="modal_borrar" class="modal">
    <div class="modal-background modal-blur-bg"></div>
    <div class="modal-content modal-content-custom">
        <div class="box modal-box-custom">
            <div class="has-text-centered mb-4 mt-2">
                    <span class="icon is-large modal-alert-icon">
                        <i class="fas fa-exclamation-triangle fa-2x"></i>
                    </span>
            </div>
            <h3 class="title is-4 has-text-centered modal-title-custom">Resetear Fondo</h3>
            <p class="has-text-centered mb-5 modal-text-custom">
                Esta acción borrará permanentemente todas las transacciones y dejará la plata del fondo en $0. Esta acción no se puede deshacer.
            </p>
            <div class="buttons is-centered mt-5">
                <button id="btn_cancelar_modal" class="button is-light btn-modal">Cancelar</button>
                <button id="btn_confirmar_modal" class="button is-danger btn-modal btn-modal-confirm">Sí, borrar todo</button>
            </div>
        </div>
    </div>
</div>
<div id="toast_notificacion" class="toast-custom is-hidden">
    <span class="icon mr-2" id="toast_icon"></span>
    <span id="toast_msg" style="font-weight: 500;"></span>
</div>

<script>
    const API_URL = "http://localhost:3030/api";
    const tablaHistorial = document.getElementById("tabla_historial");

    async function cargarHistorial() {
        try {
            const res = await fetch(`${API_URL}/transacciones`);
            const historial = await res.json();

            tablaHistorial.innerHTML = "";

            if (historial.length === 0) {
                tablaHistorial.innerHTML = `<tr><td colspan="6" class="has-text-centered has-text-grey">No hay transacciones registradas.</td></tr>`;
                return;
            }

            historial.forEach(tx => {
                const fechaObj = new Date(tx.fecha);
                const fechaFormateada = fechaObj.toLocaleDateString('es-AR') + ' ' + fechaObj.toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit'});

                const esAporte = tx.tipo === "APORTE";
                const tagClass = esAporte ? "is-success" : "is-danger";
                const iconClass = esAporte ? "fa-arrow-down" : "fa-arrow-up";

                const montoAbsoluto = Math.abs(parseFloat(tx.monto_fiat));
                const cuotasAbsolutas = Math.abs(parseFloat(tx.cuotapartes));

                const tr = document.createElement("tr");
                tr.innerHTML = `
                        <td class="td-fecha">${fechaFormateada}</td>
                        <td class="td-socio">${tx.nombre}</td>
                        <td>
                            <span class="tag ${tagClass} is-light is-rounded has-text-weight-semibold">
                                <span class="icon is-small mr-1"><i class="fas ${iconClass}"></i></span>
                                ${tx.tipo}
                            </span>
                        </td>
                        <td class="td-monto">$${montoAbsoluto.toLocaleString('es-AR', {minimumFractionDigits: 2})}</td>
                        <td class="td-cuotas">${cuotasAbsolutas.toFixed(4)}</td>
                        <td class="td-precio">$${parseFloat(tx.precio_cuota).toLocaleString('es-AR', {minimumFractionDigits: 2})}</td>
                    `;
                tablaHistorial.appendChild(tr);
            });

        } catch (error) {
            console.error("Error al cargar historial:", error);
            tablaHistorial.innerHTML = `<tr><td colspan="6" class="has-text-centered has-text-danger">Error de conexión con el servidor.</td></tr>`;
        }
    }

    // Función para mostrar la notificación flotante
    function mostrarToast(mensaje, esError = false) {
        const toast = document.getElementById("toast_notificacion");
        const toastMsg = document.getElementById("toast_msg");
        const toastIcon = document.getElementById("toast_icon");

        toastMsg.textContent = mensaje;

        if (esError) {
            toast.className = "toast-custom toast-error";
            toastIcon.innerHTML = '<i class="fas fa-times-circle"></i>';
        } else {
            toast.className = "toast-custom toast-success";
            toastIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
        }

        // Mostrar el toast
        toast.classList.remove("is-hidden");

        // Ocultarlo automáticamente después de 3.5 segundos
        setTimeout(() => {
            toast.classList.add("is-hidden");
        }, 3500);
    }

    // Variables del Modal
    const modalBorrar = document.getElementById("modal_borrar");
    const btnLimpiar = document.getElementById("btn_limpiar");
    const btnCancelarModal = document.getElementById("btn_cancelar_modal");
    const btnConfirmarModal = document.getElementById("btn_confirmar_modal");

    // Funciones para abrir y cerrar
    const abrirModal = () => modalBorrar.classList.add("is-active");
    const cerrarModal = () => modalBorrar.classList.remove("is-active");

    // Eventos de apertura/cierre
    btnLimpiar.addEventListener("click", abrirModal);
    btnCancelarModal.addEventListener("click", cerrarModal);

    // Si el usuario hace clic afuera de la tarjetita, también se cierra
    modalBorrar.querySelector('.modal-background').addEventListener("click", cerrarModal);

    // Lógica de confirmación (Al hacer clic en "Sí, borrar todo")
    // Lógica de confirmación (Al hacer clic en "Sí, borrar todo")
    btnConfirmarModal.addEventListener("click", async () => {
        btnConfirmarModal.classList.add("is-loading");

        try {
            const res = await fetch(`${API_URL}/transacciones`, {
                method: 'DELETE'
            });
            const data = await res.json();

            if (data.status) {
                cargarHistorial();
                cerrarModal();

                // REEMPLAZAMOS EL ALERT VIEJO POR EL TOAST NUEVO
                mostrarToast("El fondo ha sido reiniciado exitosamente.", false);
            } else {
                cerrarModal();
                mostrarToast("Error: " + data.mensaje, true);
            }
        } catch (error) {
            console.error("Error al limpiar:", error);
            cerrarModal();
            mostrarToast("Error de conexión con el servidor.", true);
        } finally {
            btnConfirmarModal.classList.remove("is-loading");
        }
    });

    cargarHistorial();
</script>
</body>
</html>
