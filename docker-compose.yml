version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fondo_db
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "3030:3030"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=fondo_db
      - DB_PORT=5432